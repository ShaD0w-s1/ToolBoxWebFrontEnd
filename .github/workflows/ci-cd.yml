name: Frontend CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type-check and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run check

      - name: Upload production build
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy production website
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Download production build
        uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: dist

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install CloudBase CLI
        run: npm install --global @cloudbase/cli@latest

      - name: Log in to CloudBase
        run: tcb login --cloudbase-api-key "${{ secrets.CLOUDBASE_API_KEY }}" -e "${{ secrets.TCB_ENV_ID }}"

      - name: Deploy static website
        run: tcb hosting deploy ./dist / -e "${{ secrets.TCB_ENV_ID }}"
