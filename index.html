<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2f5597" />
    <meta name="color-scheme" content="light" />

    <!-- canonical / og:url / og:image 由构建期注入（vite.config.ts 的 siteUrlPlugin）。
         默认值 = vite.config.ts 的 DEFAULT_SITE_URL；可用环境变量 VITE_SITE_URL 覆盖。
         ⚠️ 换域名或改部署路径时只改那一处，不要再硬编码到这里（抓取器不执行 JS，运行时补正无效）。
         构建后由 scripts/check-build-meta.mjs 断言占位符已被替换。 -->
    <title>工作准备工具站</title>
    <meta
      name="description"
      content="航空定检工作准备协作工具：工作准备单、工卡分配清单、航材与工具清单、换发/APU 甘特准备单，多人实时协同、免登录使用。"
    />
    <!-- 内部工具：不收录进搜索引擎。这同时是对「安全边界依赖 URL 保密」的一道加固。
         若将来需要被搜索收录，把下面这行改为 index, follow 或直接删除。 -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="%VITE_SITE_URL%" />

    <!-- Open Graph：决定链接粘贴到企业微信 / 微信 / 钉钉 / 邮件时的预览卡片 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="工作准备工具站" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:title" content="工作准备工具站" />
    <meta
      property="og:description"
      content="航空定检工作准备协作工具：工作准备单、工卡分配清单、航材与工具清单、换发/APU 甘特准备单，多人实时协同、免登录使用。"
    />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:image" content="%VITE_SITE_URL%favicon-512x512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="工作准备工具站" />

    <!-- Twitter / X 卡片（部分客户端与抓取服务也会读这一组） -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="工作准备工具站" />
    <meta
      name="twitter:description"
      content="航空定检工作准备协作工具：工作准备单、工卡分配清单、航材与工具清单、换发/APU 甘特准备单，多人实时协同、免登录使用。"
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%favicon-512x512.png" />

    <link rel="icon" href="./favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="48x48" href="./favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p style="font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;padding:32px;color:#1a1f2b">
        本工具需要启用 JavaScript 才能运行，请在浏览器设置中开启后刷新页面。
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
