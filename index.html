<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>吉祥定检工具清单</title>
<style>
  :root{
    --blue:#4472C4; --blue-d:#2f5597; --blue-l:#8EAADB; --blue-ll:#D9E1F2;
    --green:#548235; --green-l:#E2EFDA; --grey:#666; --line:#E0E0E0;
    --bg:#f4f6fb; --card:#fff; --txt:#222;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);line-height:1.6;overflow-x:hidden;}
  header.top{background:linear-gradient(90deg,var(--blue),var(--blue-d));color:#fff;padding:16px 24px;}
  header.top h1{margin:0;font-size:20px;font-weight:700;}
  header.top .sub{font-size:12px;opacity:.9;margin-top:2px;}
  .cloud-status{display:inline-block;margin-top:8px;font-size:12px;padding:3px 10px;border-radius:20px;background:rgba(255,255,255,.18);color:#fff;font-weight:600;}
  .cloud-status.ok{background:rgba(46,204,113,.28);}
  .cloud-status.warn{background:rgba(241,196,15,.32);color:#fff;}
  .cloud-status.err{background:rgba(231,76,60,.35);}
  main{padding:20px 24px;max-width:1100px;margin:0 auto;}
  .hidden{display:none!important;}
  /* 列表工具栏 */
  .list-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .list-bar button,.list-bar label.btn{cursor:pointer;border:1px solid var(--blue-l);background:#fff;color:var(--blue-d);
    padding:8px 15px;border-radius:8px;font-size:13px;font-weight:600;transition:.15s;}
  .list-bar button:hover,.list-bar label.btn:hover{background:var(--blue-ll);}
  .list-bar button.primary{background:var(--blue);color:#fff;border-color:var(--blue);}
  .list-bar button.primary:hover{background:var(--blue-d);}
  .list-bar input.date-search{border:1px solid var(--blue-l);border-radius:8px;padding:7px 12px;font-size:13px;min-width:200px;color:var(--txt);}
  /* 大项目卡片 */
  .proj{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:10px;
    padding:14px 18px;margin-bottom:12px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .proj:hover{border-color:var(--blue-l);}
  .proj.std{background:var(--green-l);border-color:#b6d7a8;}
  .proj-main{flex:1;}
  .proj-name{font-size:16px;font-weight:700;}
  .proj-date{font-size:12px;color:var(--grey);margin-top:3px;}
  .proj-team{margin-top:6px;display:flex;align-items:center;gap:6px;}
  .proj-team label{font-size:12px;color:var(--grey);}
  .proj-team select,.team-filter{font-size:13px;padding:6px 8px;border:1px solid var(--blue-l);border-radius:8px;background:#fff;color:var(--txt);}
  .proj-acts{display:flex;gap:8px;flex-shrink:0;}
  .proj-acts button{border:1px solid var(--blue-l);background:#fff;color:var(--blue-d);border-radius:7px;padding:6px 14px;font-size:13px;cursor:pointer;font-weight:600;}
  .proj-acts button.primary{background:var(--blue);color:#fff;border-color:var(--blue);}
  .proj-acts button.del{border-color:#e6a0a0;color:#c0392b;}
  .proj.cart{background:#FCE4D6;border-color:#f0b27a;}
  /* 详情头 */
  .detail-head{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 18px;margin-bottom:14px;flex-wrap:wrap;}
  .detail-head #btn-back{background:#fff;border:1px solid var(--blue-l);color:var(--blue-d);border-radius:7px;padding:6px 14px;cursor:pointer;font-weight:600;}
  .detail-head .dt{font-size:17px;font-weight:700;}
  .detail-head .dd{font-size:12px;color:var(--grey);}
  .detail-head .summary{margin-left:auto;display:flex;gap:18px;font-size:14px;}
  .detail-head .summary b{font-size:16px;}
  /* 详情工具栏 / tabs */
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:0 0 12px;}
  .toolbar button,.toolbar label.btn{cursor:pointer;border:1px solid var(--blue-l);background:#fff;color:var(--blue-d);
    padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;}
  .toolbar button:hover,.toolbar label.btn:hover{background:var(--blue-ll);}
  .toolbar button.primary{background:var(--blue);color:#fff;border-color:var(--blue);}
  .toolbar button.primary:hover{background:var(--blue-d);}
  .cart-toggle{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--blue-d);border:1px solid var(--blue-l);background:#fff;border-radius:8px;padding:7px 14px;cursor:pointer;user-select:none;}
  .cart-toggle input{width:16px;height:16px;cursor:pointer;accent-color:#e67e22;margin:0;}
  .type-sel{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--blue-d);border:1px solid var(--blue-l);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;user-select:none;}
  .type-sel select{border:none;background:transparent;font-size:13px;font-weight:700;color:var(--blue-d);cursor:pointer;outline:none;padding:0;}
  .toolbar .spacer{margin-left:auto;}
  .tabs{display:flex;gap:4px;padding:0 0 8px;border-bottom:1px solid var(--line);}
  .tab{padding:10px 20px;cursor:pointer;border:none;background:none;font-size:14px;font-weight:600;color:var(--grey);border-bottom:3px solid transparent;}
  .tab.active{color:var(--blue-d);border-bottom-color:var(--blue);}
  /* 集中显示 */
  .cat{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .cat-head{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;line-height:1.5;}
  .cat-head .name{font-size:17px;font-weight:700;}
  .cat-head .total{font-size:13px;opacity:.9;}
  .cat-head .spacer{margin-left:auto;display:flex;gap:8px;}
  .cat-head button{background:#fff;color:#222;border:1px solid rgba(0,0,0,.18);border-radius:7px;padding:5px 11px;font-size:12px;cursor:pointer;font-weight:600;}
  .cat-head button:hover{background:#eef1f7;}
  .cat-body{padding:0;}
  /* 部位备注行 */
  .notes-row{padding:10px 16px 0;}
  .notes-row textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit;line-height:1.6;resize:none;color:var(--txt);overflow:hidden;box-sizing:border-box;}
  .notes-row textarea:focus{outline:none;border-color:var(--blue);}
  .sub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;padding:12px 16px 16px;}
  .sub{background:#fafbff;border:1px solid var(--blue-ll);border-radius:10px;margin-top:0;padding:10px 12px;container-type:inline-size;}
  .sub.wide{grid-column:span 2;}
  .sub.wider{grid-column:span 3;}
  .sub.full{grid-column:1 / -1;}
  .sub-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;line-height:1.7;}
  .sub-head input.sel{width:18px;height:18px;cursor:pointer;accent-color:var(--green);}
  .sub-head input.subname{font-weight:700;font-size:14px;border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;flex:0 0 auto;max-width:120px;line-height:1.6;}
  .sub-head input.subname:hover{border-color:var(--blue-l);}
  .sub-head input.subname:focus{border-color:var(--blue);background:#fff;outline:none;}
  .sub-head select.stdpick{font-size:12px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--blue-d);max-width:140px;cursor:pointer;}
  .sub-head .stotal{font-size:13px;color:var(--blue-d);font-weight:600;}
  .sub-head .spacer{margin-left:auto;display:flex;gap:6px;}
  .sub-head button{background:#fff;border:1px solid var(--blue-l);color:var(--blue-d);border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer;}
  .sub-head button:hover{background:var(--blue-ll);}
  .sub-head button.del{border-color:#e6a0a0;color:#c0392b;}
  .sub-head button.del:hover{background:#fdecea;}
  .item-grid{display:grid;grid-template-columns:1fr;gap:8px;padding-top:6px;}
  /* 物品卡按「工作卡自身宽度」自适应列数，最多 3 列，各列等宽 */
  @container (min-width:560px){ .item-grid{grid-template-columns:repeat(2,1fr);} }
  @container (min-width:820px){ .item-grid{grid-template-columns:repeat(3,1fr);} }
  .item{display:flex;align-items:center;gap:8px;width:100%;flex:1 1 auto;border:1px solid var(--line);border-radius:8px;padding:8px 8px;line-height:1.6;}
  .item textarea.name{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:13px;line-height:1.6;resize:none;overflow:hidden;white-space:pre-wrap;word-break:break-word;field-sizing:content;}
  .item textarea.name:focus{outline:none;border-color:var(--blue);}
  .qty{display:flex;align-items:center;gap:0;}
  .qty button{width:28px;height:28px;border:1px solid var(--blue-l);background:#fff;color:var(--blue-d);font-size:16px;cursor:pointer;border-radius:6px 0 0 6px;}
  .qty button.plus{border-radius:0 6px 6px 0;border-left:none;}
  .qty button:hover{background:var(--blue-ll);}
  .qty input{border:1px solid var(--blue-l);border-left:none;border-right:none;width:56px;height:28px;text-align:center;font-size:13px;}
  .qty input:focus{outline:none;border-color:var(--blue);}
  .item button.del{background:#fff;border:1px solid #e6a0a0;color:#c0392b;border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:14px;}
  .item button.del:hover{background:#fdecea;}
  .item.dup{background:rgba(255,235,59,0.5);border-color:#f1c40f;}
  .empty{padding:10px 30px;color:var(--grey);font-size:13px;}
  .list-status{font-size:12px;color:var(--grey);margin-bottom:10px;padding:6px 10px;background:#fff;border:1px solid var(--line);border-radius:8px;}
  /* 数据库 */
  table.db{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  table.db th,table.db td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;font-size:13px;}
  table.db th{background:var(--blue);color:#fff;font-weight:600;}
  table.db tr:nth-child(even){background:#fafbff;}
  table.db tr.dup-row{background:rgba(255,235,59,0.5);}
  table.db input,table.db select{border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:13px;width:100%;}
  table.db input:focus,table.db select:focus{outline:none;border-color:var(--blue);}
  table.db button.del{background:#fff;border:1px solid #e6a0a0;color:#c0392b;border-radius:6px;padding:3px 9px;cursor:pointer;}
  .db-actions{margin-bottom:12px;display:flex;gap:8px;}
  .note{font-size:12px;color:var(--grey);margin-top:8px;line-height:1.6;}
  /* 分享 toast / banner */
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9999;}
  #toast.show{opacity:1;}
  #share-banner{position:fixed;top:0;left:0;right:0;background:#fff8e1;border-bottom:1px solid #f1c40f;color:#7a5b00;padding:10px 18px;display:flex;align-items:center;gap:12px;font-size:13px;z-index:9998;box-shadow:0 2px 6px rgba(0,0,0,.08);flex-wrap:wrap;}
  #share-banner .spacer{margin-left:auto;}
  #share-banner button{border:1px solid #f1c40f;background:#fff;color:#7a5b00;border-radius:6px;padding:5px 12px;cursor:pointer;font-weight:600;}
  #share-banner button.primary{background:#f1c40f;}
  /* ===== 移动端适配（手机浏览器：安卓 / iOS / 华为） ===== */
  @media (max-width: 768px){
    main{padding:12px 12px;}
    header.top{padding:12px 16px;}
    header.top h1{font-size:18px;}
    /* 列表工具栏：搜索框独占一行，按钮自适应填充；工具栏常驻顶部便于随时搜索 */
    .list-bar{position:sticky;top:0;background:var(--bg);z-index:50;padding:4px 0;}
    .list-bar button,.list-bar label.btn{flex:1 1 auto;}
    .list-bar .spacer{display:none;}
    .list-bar input.date-search{flex:1 1 100%;min-width:0;}
    .list-bar select.team-filter{flex:1 1 100%;min-width:0;}
    /* 项目卡片：纵向堆叠，操作按钮等宽 */
    .proj{flex-direction:column;align-items:stretch;}
    .proj-acts{width:100%;justify-content:flex-end;}
    .proj-acts button{flex:1 1 auto;}
    /* 详情头 */
    .detail-head{padding:10px 12px;gap:10px;}
    .detail-head .dt{font-size:16px;}
    .detail-head .summary{margin-left:0;width:100%;justify-content:space-between;}
    /* 工具栏：换行，按钮自适应，隐藏右推 spacer */
    .toolbar .spacer{display:none;}
    .toolbar button,.toolbar label.btn{flex:1 1 auto;font-size:14px;padding:9px 10px;}
    .toolbar .type-sel,.toolbar .cart-toggle{flex:0 0 auto;}
    /* 部位块：单列；部位头换行 */
    .cat-head{flex-wrap:wrap;}
    .cat-head .spacer{margin-left:0;width:100%;justify-content:flex-end;}
    .sub-grid{grid-template-columns:1fr !important;}
    .sub-head input.subname{flex:1 1 100%;max-width:none;}
    .sub-head select.stdpick{flex:1 1 100%;max-width:none;}
    /* 物品整行显示，避免横向溢出；强制单列（覆盖容器查询） */
    .item{width:100%;flex:1 1 auto;}
    .item-grid{grid-template-columns:1fr !important;gap:6px;}
    /* 输入框字号 >=16px，防止 iOS 聚焦自动放大 */
    .notes-row textarea,.item textarea.name,.list-bar input.date-search,
    .sub-head input.subname,.sub-head select.stdpick,.type-sel select,
    .qty input,table.db input,table.db select{font-size:16px;}
    /* 数据库表横向滚动，避免窄屏挤压 */
    #view-database,#view-cart{overflow-x:auto;}
    table.db{font-size:12px;}
  }
  @media (max-width: 480px){
    .toolbar button,.toolbar label.btn{padding:9px 8px;font-size:13px;}
    .detail-head .summary{font-size:13px;}
  }
  /* 登录遮罩（协作模式） */
  #login-overlay{position:fixed;inset:0;background:rgba(244,246,251,.97);display:flex;align-items:center;justify-content:center;z-index:9999;}
  #login-overlay.hidden{display:none;}
  .login-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:32px 36px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.12);max-width:340px;width:86%;}
  .login-card h2{margin:0 0 8px;font-size:20px;color:var(--blue-d);}
  .login-card p{margin:0 0 20px;color:var(--grey);font-size:13px;line-height:1.6;}
  .login-card .wechat{background:#07c160;color:#fff;border:none;border-radius:8px;padding:11px 28px;font-size:15px;font-weight:600;cursor:pointer;width:100%;}
  .login-card .wechat:hover{background:#06ad56;}
  .login-card .name-input{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:11px 12px;font-size:16px;margin-bottom:14px;outline:none;font-family:inherit;}
  .login-card .name-input:focus{border-color:var(--blue);}
  .login-tip{margin:18px 0 0;font-size:12px;color:var(--grey);}
</style>
</head>
<body>
<header class="top">
  <h1>吉祥定检工具清单</h1>
  <div class="sub">两级管理：工作项目（第一级） → 物品明细（第二级）。新建工作项目以「A320/B787 标准库」为初始模板。</div>
  <div id="cloud-status" class="cloud-status" title="协作与云端保存状态">连接中…</div>
</header>

<main>
  <!-- 第一级：大项目列表（工具清单 / 数据库 两页） -->
  <section id="screen-list">
    <div class="tabs" id="list-tabs">
      <button class="tab active" data-ltab="tools">工具清单</button>
      <button class="tab" data-ltab="db">数据库</button>
    </div>

    <!-- 工具清单页（优先显示） -->
    <div id="list-tools">
      <div class="list-bar">
        <button class="primary" id="btn-newproj">+ 新建工作项目</button>
        <button id="btn-export-all">导出全部</button>
        <label class="btn">导入全部<input type="file" id="file-all" accept="application/json" hidden></label>
        <button id="btn-share-list">分享本页</button>
        <span class="spacer"></span>
        <select id="filter-team" class="team-filter" autocomplete="off">
          <option value="">班组：全部</option>
          <option value="A1">A1</option>
          <option value="A2">A2</option>
          <option value="A3">A3</option>
          <option value="B1">B1</option>
          <option value="B2">B2</option>
          <option value="B3">B3</option>
          <option value="C1">C1</option>
          <option value="C2">C2</option>
          <option value="C3">C3</option>
          <option value="外站">外站</option>
        </select>
        <input type="text" id="search-date" class="date-search" placeholder="搜索日期，显示该日 ±5 天，如 2026-08-06" autocomplete="off">
        <button id="btn-search-date">搜索</button>
        <button id="btn-clear-search">清除</button>
      </div>
      <div id="view-list"></div>
    </div>

    <!-- 数据库页 -->
    <div id="list-db" class="hidden">
      <div id="view-db"></div>
    </div>
  </section>

  <!-- 第二级：大项目详情 -->
  <section id="screen-detail" class="hidden">
    <div class="detail-head">
      <button id="btn-back">← 返回</button>
      <div>
        <div class="dt" id="detail-title"></div>
        <div class="dd" id="detail-date"></div>
      </div>
      <div class="summary">
        <div>全部合计：<b id="hdr-all">0</b></div>
      </div>
    </div>

    <div class="toolbar">
      <button class="primary" id="btn-addcat">+ 添加部位</button>
      <label class="type-sel">机型：
        <select id="sel-type">
          <option value="A320">A320</option>
          <option value="B787">B787</option>
        </select>
      </label>
      <button id="btn-import-xlsx" class="hidden">导入xlsx</button>
      <label class="cart-toggle"><input type="checkbox" id="chk-cart"> 使用工具车</label>
      <button id="btn-export-csv">导出表格</button>
      <button id="btn-export-img">导出图片</button>
      <button id="btn-share-detail">分享本页</button>
      <span class="spacer"></span>
      <button id="btn-clear">清空数据</button>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="display">集中显示</button>
      <button class="tab" data-tab="database">数据库</button>
    </div>

    <div id="view-display"></div>
    <div id="view-database" class="hidden"></div>
  </section>

  <!-- 工具车数据库编辑器 -->
  <section id="screen-cart" class="hidden">
    <div class="detail-head">
      <button id="btn-cart-back">← 返回</button>
      <div>
        <div class="dt">工具车数据库</div>
        <div class="dd">工具车物品清单（物品 / 数量），用于在工作项目中对比高亮重复物品</div>
      </div>
    </div>
    <div class="toolbar">
      <button id="btn-import-cart-xlsx">导入xlsx</button>
      <span class="spacer"></span>
      <button id="btn-share-cart">分享本页</button>
    </div>
    <div id="view-cart"></div>
  </section>
</main>

<div id="toast"></div>
<div id="share-banner" class="hidden">
  <span>你正在查看通过链接分享的内容（尚未保存到本地）。</span>
  <span class="spacer"></span>
  <button id="btn-share-save" class="primary">保存到本地</button>
  <button id="btn-share-cancel">取消</button>
</div>
<div id="login-overlay" class="hidden">
  <div class="login-card">
    <h2>吉祥定检工具清单</h2>
    <p id="login-msg">输入用户名即可进入多人协作（无需密码）</p>
    <input id="login-name" class="name-input" placeholder="请输入你的用户名" maxlength="20" autocomplete="off" />
    <button id="btn-enter" class="wechat">进入协作</button>
    <p class="login-tip">团队成员输入用户名后编辑同一份数据并实时同步。</p>
  </div>
</div>
<script type="module">
import html2canvas from "html2canvas";
import * as XLSX from "xlsx";
import { backend } from "/src/api.js";

"use strict";
const STORAGE_KEY = "categoryItemManager.v2";

// Django REST 持久化；localStorage 只作为断线缓存。
const COLLAB = false;
const REMOTE = true;
let remoteAvailable = false;

function sampleState(){
  let id=1;
  const mk=(cat,sub,name,qty)=>({id:id++,cat,sub,name,qty});
  return {
    categories:["A","B","C","D","E"],
    items:[
      mk("A","项目A1","螺丝",10), mk("A","项目A1","垫圈",20),
      mk("A","项目A2","电缆",5),  mk("A","项目A2","接头",8),

function deepCopy(o){ return JSON.parse(JSON.stringify(o)); }
function normalizeState(s){ s=s||{}; s.categories=s.categories||[]; s.items=s.items||[]; s.notes=s.notes||{}; s.useCart=!!s.useCart; delete s.selected; return s; }
function normalizeApp(d){ d=d||{}; if(d.standard){ d.libraries=d.libraries||{}; if(!d.libraries.A320) d.libraries.A320=d.standard; if(!d.libraries.B787) d.libraries.B787=deepCopy(d.standard); delete d.standard; } d.libraries=d.libraries||{A320:sampleState(),B787:sampleState()}; ["A320","B787"].forEach(t=>{ d.libraries[t]=normalizeState(d.libraries[t]); }); d.toolCart=(d.toolCart||[]).map(i=>({name:String(i.name==null?"":i.name), qty:Math.max(0,parseInt(i.qty,10)||0)})); d.projects=(d.projects||[]).map(p=>{ p.data=normalizeState(p.data); if(!p.aircraftType) p.aircraftType="A320"; if(!p.team) p.team=""; return p; }); return d; }
function stateFromSections(sections, useCart=false){
  const state={categories:[],items:[],notes:{},useCart:!!useCart};
  let id=1;
  (Array.isArray(sections)?sections:[]).forEach(section=>{
    const cat=String(section&&section.name||"").trim(); if(!cat) return;
    if(!state.categories.includes(cat)) state.categories.push(cat);
    if(section.note) state.notes[cat]=String(section.note);
    (Array.isArray(section.tasks)?section.tasks:[]).forEach(task=>{
      const sub=String(task&&task.name||"").trim();
      (Array.isArray(task&&task.items)?task.items:[]).forEach(item=>{
        state.items.push({id:id++,cat,sub,name:String(item&&item.name||""),qty:Math.max(0,parseInt(item&&item.quantity,10)||0)});
      });
    });
  });
  return normalizeState(state);
}
function sectionsFromState(state){
  const categories=[...(state.categories||[])];
  (state.items||[]).forEach(item=>{ if(item.cat&&!categories.includes(item.cat)) categories.push(item.cat); });
  return categories.map(cat=>{
    const subs=[];
    (state.items||[]).filter(item=>item.cat===cat).forEach(item=>{ if(!subs.includes(item.sub)) subs.push(item.sub); });
    return {name:cat,note:(state.notes&&state.notes[cat])||"",tasks:subs.map(sub=>({
      name:sub,
      items:(state.items||[]).filter(item=>item.cat===cat&&item.sub===sub).map(item=>({name:item.name,quantity:Math.max(0,parseInt(item.qty,10)||0)}))
    }))};
  });
}
function unwrapDocument(value){
  if(Array.isArray(value)) return value[0]||null;
  if(value&&Array.isArray(value.data)) return value.data[0]||null;

}
function projectFromDocument(raw){

}

function documentsFromList(payload){
  const value=payload&&payload.data;

function subKey(cat,sub){ return cat+"||"+sub; }
function itemsOf(cat,sub){ return active.items.filter(i=>i.cat===cat && i.sub===sub); }
function subsOf(cat){ const s=new Set(); active.items.forEach(i=>{ if(i.cat===cat) s.add(i.sub); }); return [...s]; }
function subTotal(cat,sub){ return itemsOf(cat,sub).reduce((a,i)=>a+(+i.qty||0),0); }

function h(tag, attrs, ...kids){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==="class") e.className=attrs[k];
    else if(k.startsWith("on")&&typeof attrs[k]==="function") e.addEventListener(k.slice(2),attrs[k]);
    else if(attrs[k]!==null&&attrs[k]!==undefined) e.setAttribute(k,attrs[k]);
  }
  kids.flat().forEach(c=>{ if(c===null||c===undefined||c===false) return; e.appendChild(typeof c==="string"?document.createTextNode(c):c); });
  return e;
}
function b64(s){ return "k"+btoa(unescape(encodeURIComponent(s))).replace(/=/g,""); }
function fmtDate(ts){ const d=new Date(ts); const p=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes()); }
// 文本域自动增高以适配换行内容
function autoGrow(ta){ ta.style.height="auto"; ta.style.height=ta.scrollHeight+"px"; }

// ---- 日期窗口辅助（第一级列表 ±5 天）----
function parseDateStr(s){ s=(s||"").trim(); if(!s) return null; const m=s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/); if(!m) return null; const y=+m[1],mo=+m[2],d=+m[3]; const dt=new Date(y,mo-1,d); if(isNaN(dt.getTime())||dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d) return null; return dt; }
function startOfDay(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }
function fmtDay(ts){ const d=new Date(ts); const p=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }

// 重建 DOM 时保留焦点与正在输入的内容（避免远端同步刷新时打断编辑 / 丢失光标）
function withFocusPreserved(root, build){
  const ae=document.activeElement;
  let fk=null, val="", sel=null;
  if(ae && ae!==document.body && root.contains(ae)){
    fk=ae.getAttribute("data-fk");
    if(fk!==null && (ae.tagName==="TEXTAREA"||ae.tagName==="INPUT")){ val=ae.value; try{ sel={s:ae.selectionStart,e:ae.selectionEnd}; }catch(_){} }
  }
  root.innerHTML="";
  build();
  if(fk){
    const el=root.querySelector('[data-fk="'+String(fk).replace(/["\\]/g,"\\$&")+'"]');
    if(el){ el.value=val; try{ el.focus(); if(sel&&el.setSelectionRange) el.setSelectionRange(sel.s,sel.e); }catch(_){} }
  }
}

function hexToRgb(hex){ const m=hex.replace("#",""); const n=parseInt(m.length===3?m.split("").map(c=>c+c).join(""):m,16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function hslToHex(h,s,l){ s/=100;l/=100; const k=n=>(n+h/30)%12; const a=s*Math.min(l,1-l); const f=n=>{ const c=l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1))); return Math.round(255*c).toString(16).padStart(2,"0"); }; return "#"+f(0)+f(8)+f(4); }
function catColor(cat){
  if(CAT_COLORS[cat]) return CAT_COLORS[cat];
  let hash=0; const s=String(cat); for(let i=0;i<s.length;i++) hash=(hash*31+s.charCodeAt(i))>>>0;
  return hslToHex(hash%360,68,52);
}

  const winStart = center.getTime()-5*864e5, winEnd = center.getTime()+5*864e5;
  const sorted=[...app.projects].sort((a,b)=>b.createdAt-a.createdAt);
  const filtered = sorted.filter(p=>{
    if(p.createdAt<winStart || p.createdAt>winEnd) return false;
    if(teamFilter && p.team!==teamFilter) return false;
    return true;
  });
  withFocusPreserved(root, ()=>{
    root.appendChild(h("div",{class:"list-status"},
      "显示 "+fmtDay(winStart)+" 至 "+fmtDay(winEnd)+" 的数据（今日起 ±5 天"+(listSearch? "，已按搜索日期": "")+"） · 共 "+filtered.length+" 项"));
    if(filtered.length===0){
      root.appendChild(h("div",{class:"empty"}, "该时间段内暂无工作项目。可点「+ 新建工作项目」创建，或在搜索框输入其他日期查看其 ±5 天范围。"));
      return;
    }
    filtered.forEach(p=>{
      const teamSel=h("select",{class:"team-sel",title:"选择班组",
        onchange:e=>{ p.team=e.target.value; save(); renderList(true); },
        onclick:e=>e.stopPropagation()},
        h("option",{value:""},"班组：未设"),
        ...TEAMS.map(t=>h("option",{value:t, selected: p.team===t ? "selected" : null},t))
      );
      const card=h("div",{class:"proj", onclick:e=>{ if(e.target.closest("button,select,input")) return; openProject(p.id); }},
        h("div",{class:"proj-main"},
          h("div",{class:"proj-name"},p.name),
          h("div",{class:"proj-date"},"生成日期："+fmtDate(p.createdAt)+" · 共 "+p.data.items.length+" 项 · 总量 "+p.data.items.reduce((a,i)=>a+(+i.qty||0),0)),
          h("div",{class:"proj-team"}, h("label",{},"班组"), teamSel)
        ),
        h("div",{class:"proj-acts"},
          h("button",{class:"primary",onclick:e=>{e.stopPropagation();openProject(p.id);}},"打开"),
          h("button",{onclick:e=>{e.stopPropagation();renameProject(p.id);}},"重命名"),
          h("button",{class:"del",onclick:e=>{e.stopPropagation();deleteProject(p.id);}},"删除")
        )
      );
      root.appendChild(card);
    });
  });
}

  currentProjectId=id; editingLibrary=null; active=p.data; view="detail"; currentTab="display";
  currentAircraftType=p.aircraftType||"A320";

function openLibrary(type){

function render(){

// ---------- mutations (on active) ----------
function addItem(cat,sub,name){ active.items.push({id:nextItemId++,cat,sub:sub||"",name:name||"新物品",qty:1}); save(); render(); }
function deleteItem(id){ active.items=active.items.filter(i=>i.id!==id); save(); render(); }
function addSub(cat){ const name="新工作"+(subsOf(cat).length+1); active.items.push({id:nextItemId++,cat,sub:name,name:"新物品",qty:1}); save(); render(); }
function deleteSub(cat,sub){
  if(!confirm("确定删除工作「"+cat+" / "+sub+"」及其下全部物品？")) return;
  active.items=active.items.filter(i=>!(i.cat===cat&&i.sub===sub)); save(); render();
}
function renameSub(cat,oldSub,newSub){
  newSub=(newSub||"").trim(); if(!newSub||newSub===oldSub) return render();
  active.items.forEach(i=>{ if(i.cat===cat&&i.sub===oldSub) i.sub=newSub; });
  save(); render();
}
// 从标准数据库导入某小项目的物品数据到当前小项目
function importStdSub(cat,oldSub,stdKey){
  const parts=stdKey.split("||"); const scat=parts[0], ssub=parts[1];
  const src=app.libraries[currentAircraftType].items.filter(i=>i.cat===scat && i.sub===ssub);
  // 重命名当前小项目为标准库小项目名称
  active.items.forEach(i=>{ if(i.cat===cat&&i.sub===oldSub) i.sub=ssub; });
  // 写入标准库该小项目的物品数据（数量一并带入）
  src.forEach(i=> active.items.push({id:nextItemId++,cat:cat,sub:ssub,name:i.name,qty:i.qty}));
  save(); render();
}
function addCategory(){
  const name=prompt("请输入部位名称（如 F）：",""); if(!name) return;
  const n=name.trim(); if(!n) return;
  if(active.categories.includes(n)){ alert("已存在该部位"); return; }
  active.categories.push(n); save(); render();
}
function renameCategory(cat){
  const name=prompt("重命名部位：",cat); if(!name) return;
  const n=name.trim(); if(!n||n===cat) return;
  if(active.categories.includes(n)){ alert("已存在该部位"); return; }
  active.items.forEach(i=>{ if(i.cat===cat) i.cat=n; });
  if(active.notes[cat]){ active.notes[n]=active.notes[cat]; delete active.notes[cat]; }
  active.categories[active.categories.indexOf(cat)]=n; save(); render();
}
function deleteCategory(cat){
  if(!confirm("确定删除部位「"+cat+"」及其下全部工作与物品？")) return;
  active.items=active.items.filter(i=>i.cat!==cat);
  delete active.notes[cat];
  active.categories=active.categories.filter(c=>c!==cat); save(); render();
}

// ---------- 大项目操作 ----------
async function newProject(){
  const name=prompt("请输入工作项目名称：","新工作项目"); if(!name) return;
  const n=name.trim(); if(!n) return;
  const draft={id:"",name:n,createdAt:Date.now(),aircraftType:"A320",team:"",data:deepCopy(app.libraries.A320)};
  setCloudStatus("正在创建项目…","warn");
  try{
    const response=await backend.createProject(projectPayload(draft));
    const p=projectFromDocument(response.data);
    app.projects.push(p); nextItemId=computeNextId();
    try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(app)); }catch(e){}
    setCloudStatus("项目已创建 ✓","ok"); openProject(p.id);
  }catch(error){ setCloudStatus("创建失败","err"); alert("创建项目失败："+(error&&error.message||error)); }
}
function renameProject(id){
  const p=app.projects.find(x=>x.id===id); if(!p) return;
  const name=prompt("重命名工作项目：",p.name); if(!name) return;
  const n=name.trim(); if(!n) return;
  p.name=n; save(); renderList();
}
async function deleteProject(id){
  const p=app.projects.find(x=>x.id===id); if(!p) return;
  if(!confirm("确定删除工作项目「"+p.name+"」及其全部数据？")) return;
  setCloudStatus("正在删除项目…","warn");
  try{
    await backend.deleteProject(id);
    app.projects=app.projects.filter(x=>x.id!==id);
    try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(app)); }catch(e){}
    setCloudStatus("项目已删除 ✓","ok"); renderList();
  }catch(error){ setCloudStatus("删除失败","err"); alert("删除项目失败："+(error&&error.message||error)); }
}

function download(blob,name){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click(); URL.revokeObjectURL(a.href); }

function exportActiveXLSX(){
  if(typeof XLSX==="undefined"){
    alert("导出表格需联网加载组件（SheetJS）。请连接网络后重试。");
    return;
  }
  const name=(editingLibrary? (editingLibrary+"标准库") : ((app.projects.find(p=>p.id===currentProjectId)||{}).name))||"工作项目";
  const rows=[["部位","工作","物品","数量"]];
  active.items.forEach(i=>rows.push([i.cat,i.sub,i.name,i.qty]));
  const ws=XLSX.utils.aoa_to_sheet(rows);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "工具清单");
  if(active.categories.length){
    const nrows=[["部位","备注"]];
    active.categories.forEach(c=>nrows.push([c, (active.notes&&active.notes[c])||""]));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(nrows), "部位备注");
  }
  XLSX.writeFile(wb, name+".xlsx");
}
// 导出「集中显示」页面为 JPG 长截图（自动展开全部大类、隐藏工具栏与标签）
function exportImage(){
  if(typeof html2canvas!=="function"){
    alert("导出图片组件未加载，请刷新页面后重试（组件已内置，无需联网）。");
    return;
  }
  if(currentTab!=="display"){
    const t=document.querySelector('.tab[data-tab="display"]'); if(t) t.click();
  }
  const detail=document.getElementById("screen-detail");
  const hiddenForShot=[detail.querySelector(".toolbar"),detail.querySelector(".tabs")].filter(Boolean);
  hiddenForShot.forEach(e=>e.classList.add("hidden"));
  const collapsed=[];
  active.categories.forEach(cat=>{ const b=document.getElementById("cat-body-"+cat); if(b){ if(b.classList.contains("hidden")) collapsed.push(b); b.classList.remove("hidden"); } });
  const btn=document.getElementById("btn-export-img");
  const oldText=btn.textContent; btn.textContent="生成中…"; btn.disabled=true;
  const isMobile=/Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(navigator.userAgent);
  // 关键：在用户点击手势内预先打开一个空白标签页，避免 html2canvas 异步完成后 window.open 被浏览器弹窗拦截
  const w = (!navigator.share && isMobile) ? window.open("", "_blank") : null;
  const scale = isMobile ? Math.min(2, window.devicePixelRatio||1) : 2;
  requestAnimationFrame(()=>{
    html2canvas(detail,{backgroundColor:"#ffffff",scale:scale,useCORS:true,logging:false})
      .then(canvas=>{
        hiddenForShot.forEach(e=>e.classList.remove("hidden"));
        collapsed.forEach(b=>b.classList.add("hidden"));
        btn.textContent=oldText; btn.disabled=false;
        const name=(editingLibrary? (editingLibrary+"标准库") : ((app.projects.find(p=>p.id===currentProjectId)||{}).name))||"工作项目";
        const fname=name+"_集中显示_"+new Date().toISOString().slice(0,10)+".jpg";
        canvas.toBlob(blob=>{
          if(!blob){ const u=canvas.toDataURL("image/jpeg",0.9); showImageInTab(w,u,fname); return; }
          const file=new File([blob], fname, {type:"image/jpeg"});
          // 优先系统分享（安卓/iOS 可直接“保存到相册”）
          if(navigator.canShare && navigator.canShare({files:[file]})){
            navigator.share({files:[file], title:fname})
              .then(()=>{ if(w && !w.closed) try{ w.close(); }catch(_){} })
              .catch(()=>{ showImageInTab(w, URL.createObjectURL(blob), fname); });
          } else {
            showImageInTab(w, URL.createObjectURL(blob), fname);
          }
        }, "image/jpeg", 0.9);
      })
      .catch(err=>{
        hiddenForShot.forEach(e=>e.classList.remove("hidden"));
        collapsed.forEach(b=>b.classList.add("hidden"));
        btn.textContent=oldText; btn.disabled=false;
        if(w && !w.closed) try{ w.close(); }catch(_){}
        alert("生成图片失败："+(err&&err.message?err.message:err));
      });
  });
}
// 在新标签页展示图片（移动端可长按保存 / 分享；桌面端可右键保存）
function showImageInTab(w, url, fname){
  if(w && !w.closed){ try{ w.location.href=url; w.focus(); return; }catch(_){} }
  const nw=window.open(url,"_blank");
  if(!nw){ // 弹窗被拦截时退回下载
    const a=document.createElement("a"); a.href=url; a.download=fname; document.body.appendChild(a); a.click(); setTimeout(()=>{ try{ document.body.removeChild(a); }catch(_){} }, 100); }
}

// 解析 xlsx 为标准化状态（部位/工作/物品/数量 + 部位备注），再回调
function parseXLSX(file, cb){
  if(typeof XLSX==="undefined"){ alert("导入 xlsx 需联网加载组件（SheetJS）。请连接网络后重试。"); return; }
  const r=new FileReader();
  r.onload=()=>{ try{
    const wb=XLSX.read(r.result,{type:"array"});
    let items=[], cats=[], notes={};
    const sheetName = wb.SheetNames.find(n=>String(n).indexOf("工具清单")>=0) || wb.SheetNames[0];
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {header:1, defval:""});
    let start=0;
    for(let i=0;i<aoa.length;i++){ const row=aoa[i]; if(row && String(row[0])==="部位" && String(row[1])==="工作"){ start=i+1; break; } }
    let id=computeNextId();
    for(let i=start;i<aoa.length;i++){ const row=aoa[i]; if(!row||row[0]==="") continue;
      const cat=String(row[0]).trim(), sub=String(row[1]).trim(), name=String(row[2]).trim();
      const qty=Math.max(0, parseInt(row[3],10)||0);
      if(!name) continue;
      items.push({id:id++,cat:cat,sub:sub,name:name,qty:qty});
      if(!cats.includes(cat)) cats.push(cat);
    }
    const nSheet = wb.SheetNames.find(n=>String(n).indexOf("部位备注")>=0);
    if(nSheet){ const na=XLSX.utils.sheet_to_json(wb.Sheets[nSheet],{header:1,defval:""}); let ns=0;
      for(let i=0;i<na.length;i++){ const row=na[i]; if(row&&String(row[0])==="部位"&&String(row[1])==="备注"){ ns=i+1; break; } }
      for(let i=ns;i<na.length;i++){ const row=na[i]; if(!row||row[0]==="") continue; notes[String(row[0]).trim()]=String(row[1]||""); } }
    nextItemId=items.reduce((m,i)=>Math.max(m,i.id),0)+1;
    cb(normalizeState({categories:cats, items:items, notes:notes, useCart:false}));
  }catch(err){ alert("xlsx 解析失败："+(err&&err.message?err.message:err)); } };
  r.readAsArrayBuffer(file);
}
function importXLSXToLibrary(type, file){
  parseXLSX(file, st=>{
    app.libraries[type]=st; save();
    if(editingLibrary===type){ active=app.libraries[type]; render(); }
    else render();
  });
}
// 导入 xlsx 到工具车数据库（列：物品 / 数量）
function importXLSXToCart(file){
  if(typeof XLSX==="undefined"){ alert("导入 xlsx 需联网加载组件（SheetJS）。请连接网络后重试。"); return; }
  const r=new FileReader();
  r.onload=()=>{ try{
    const wb=XLSX.read(r.result,{type:"array"});
    const sheetName = wb.SheetNames.find(n=>String(n).indexOf("工具车")>=0) || wb.SheetNames[0];
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {header:1, defval:""});
    let start=0;
    for(let i=0;i<aoa.length;i++){ const row=aoa[i]; if(row && (String(row[0]).indexOf("物品")>=0 || String(row[0]).indexOf("名称")>=0) && String(row[1]).indexOf("数量")>=0){ start=i+1; break; } }
    const arr=[];
    for(let i=start;i<aoa.length;i++){ const row=aoa[i]; if(!row||row[0]==="") continue;
      const name=String(row[0]).trim(); const qty=Math.max(0, parseInt(row[1],10)||0);
      if(!name) continue;
      arr.push({name:name, qty:qty});
    }
    if(!confirm("确认用导入的 "+arr.length+" 项覆盖当前工具车数据库？")) return;
    app.toolCart=arr; save(); renderCart(); toast("工具车已导入 "+arr.length+" 项");
  }catch(err){ alert("xlsx 解析失败："+(err&&err.message?err.message:err)); } };
  r.readAsArrayBuffer(file);
}

// ---------- 分享链接 ----------
function b64enc(obj){ return btoa(unescape(encodeURIComponent(JSON.stringify(obj)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function b64dec(str){ str=(str||"").replace(/-/g,"+").replace(/_/g,"/"); try{ return JSON.parse(decodeURIComponent(escape(atob(str)))); }catch(e){ return null; } }
function shareUrl(payload){ const base=location.href.split("#")[0]; return base+"#s="+b64enc(payload); }
function normalizeProject(p){ p=p||{}; p.data=normalizeState(p.data); return p; }
let toastTimer=null;
function toast(msg){ const t=document.getElementById("toast"); if(!t) return; t.textContent=msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2200); }
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(()=>toast("链接已复制到剪贴板"),()=>fallbackCopy(t)); }
  else fallbackCopy(t);
}
function fallbackCopy(t){ const ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.top="-1000px"; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); toast("链接已复制到剪贴板"); }catch(e){ window.prompt("请复制以下链接：",t); } document.body.removeChild(ta); }
function shareList(){ if(COLLAB){ copyText(location.origin+location.pathname); toast("协作链接已复制：团队成员输入用户名后即可查看同一份数据"); return; } copyText(shareUrl({v:1,scope:"app",data:app})); }
function shareCart(){ if(COLLAB){ copyText(location.origin+location.pathname); toast("协作链接已复制：团队成员输入用户名后即可查看同一份数据"); return; } copyText(shareUrl({v:1,scope:"cart",data:app.toolCart})); }
function shareDetail(){
  if(COLLAB){ copyText(location.origin+location.pathname); toast("协作链接已复制：团队成员输入用户名后即可查看同一份数据"); return; }
  if(!active){ toast("当前页面暂无内容可分享"); return; }
  let proj;
  if(editingLibrary){ proj={id:"__lib__",name:editingLibrary+"标准库",createdAt:Date.now(),data:app.libraries[editingLibrary]}; }
  else { const p=app.projects.find(x=>x.id===currentProjectId); if(!p){ toast("当前项目未找到"); return; } proj=p; }
  copyText(shareUrl({v:1,scope:"detail",library:editingLibrary,project:proj}));
}
function showShareBanner(){ const b=document.getElementById("share-banner"); if(b) b.classList.remove("hidden"); }
function applyShared(){
  if(!location.hash || location.hash.indexOf("#s=")!==0) return;
  let payload;
  try{ payload=b64dec(location.hash.slice(3)); }catch(e){ payload=null; }
  if(!payload || !payload.scope){ alert("分享链接解析失败或格式不正确。"); return; }
  try{
    if(payload.scope==="app"){ app=normalizeApp(payload.data); backToList(); }
    else if(payload.scope==="cart"){ app.toolCart=normalizeApp({standard:{},projects:[],toolCart:payload.data}).toolCart; openCart(); }
    else if(payload.scope==="detail"){
      const proj=payload.project; if(!proj){ alert("分享内容缺少项目数据。"); return; }
      if(payload.library){ app.libraries[payload.library]=normalizeState(proj.data); openLibrary(payload.library); }
      else {
        const idx=app.projects.findIndex(x=>x.id===proj.id);
        if(idx>=0) app.projects[idx]=normalizeProject(proj); else app.projects.push(normalizeProject(proj));
        openProject(proj.id);
      }
    } else { alert("不支持的分享类型。"); return; }
    showShareBanner();
  }catch(e){ alert("分享内容加载失败："+(e&&e.message?e.message:e)); }
}

document.getElementById("btn-share-save").onclick=()=>{ save(); const b=document.getElementById("share-banner"); if(b) b.classList.add("hidden"); toast("已保存到本地"); };

document.getElementById("btn-cart-back").onclick=backToList;

  if(!active) return;
  active.useCart=e.target.checked; save(); render();
});
document.getElementById("btn-export-csv").onclick=exportActiveXLSX;
document.getElementById("btn-clear").onclick=clearActive;
document.getElementById("btn-export-img").onclick=exportImage;
document.getElementById("sel-type").addEventListener("change",e=>{
  if(!active || editingLibrary){ e.target.value=currentAircraftType; return; }
  const newType=e.target.value;
  if(!confirm("确认将当前工作项目的机型切换为「"+newType+"」？\n切换后页面数据将被重置为「"+newType+"标准库」的初始数据（当前内容将被覆盖，不可恢复）。")){
    e.target.value=currentAircraftType; return;
  }
  // 将页面数据重置为对应标准库（深拷贝，避免直接引用同一对象）
  const lib=app.libraries[newType];
  active.categories=deepCopy(lib.categories);
  active.items=deepCopy(lib.items);
  active.notes=deepCopy(lib.notes||{});
  active.useCart=!!lib.useCart;
  active.aircraftType=newType;
  const pr=app.projects.find(x=>x.id===currentProjectId); if(pr) pr.aircraftType=newType;
  currentAircraftType=newType;
  save(); render();
});
document.getElementById("btn-import-xlsx").addEventListener("click",e=>{
  if(!editingLibrary) return;
  const inp=document.createElement("input"); inp.type="file"; inp.accept=".xlsx,.xls";
  inp.addEventListener("change",ev=>{ const f=ev.target.files[0]; if(f) importXLSXToLibrary(editingLibrary,f); ev.target.value=""; });
  inp.click();
});

// ===== 协作：登录 + Yjs 连接 + 远端同步 =====
function showLoginOverlay(hide, msg){
  const el=document.getElementById("login-overlay"); if(!el) return;
  if(hide) el.classList.add("hidden"); else el.classList.remove("hidden");
  if(msg){ const m=document.getElementById("login-msg"); if(m) m.textContent=msg; }
}
// 云端连接 / 保存状态指示（让用户确认本地编辑已回传服务器）
let _cloudStatusEl=null;
function setCloudStatus(text, cls){
  if(!_cloudStatusEl) _cloudStatusEl=document.getElementById("cloud-status");
  if(!_cloudStatusEl) return;
  _cloudStatusEl.textContent=text;
  _cloudStatusEl.className="cloud-status"+(cls?(" "+cls):"");
}
function reanchorActive(){
  if(editingLibrary) active=app.libraries[editingLibrary];
  else if(currentProjectId){ const p=app.projects.find(x=>x.id===currentProjectId); active=p?p.data:null; }
  // 工具车：active 保持 null，renderCart 直接读 app.toolCart
}
async function loadRemoteApp(){
  setCloudStatus("正在连接 Django 后端…","warn");
  const status=await backend.status();
  if(!status.configured){
    remoteAvailable=false;
    setCloudStatus("后端已连接 · CloudBase 尚未配置","warn");
    return false;
  }
  remoteAvailable=true;

  const [projectsResult,a320Result,b787Result,cartResult]=await Promise.all([
    backend.listProjects(),backend.getTemplate("A320").catch(()=>null),backend.getTemplate("B787").catch(()=>null),backend.getToolCart().catch(()=>null)
  ]);
  const libraries={A320:sampleState(),B787:sampleState()};
  const a320=unwrapDocument(a320Result&&a320Result.data); if(a320) libraries.A320=stateFromSections(a320.sections);
  const b787=unwrapDocument(b787Result&&b787Result.data); if(b787) libraries.B787=stateFromSections(b787.sections);
  const cart=unwrapDocument(cartResult&&cartResult.data);
  const toolCart=(cart&&Array.isArray(cart.items)?cart.items:[]).map(item=>({name:String(item.name||""),qty:Math.max(0,parseInt(item.quantity??item.qty,10)||0)}));
  app=normalizeApp({libraries,projects:documentsFromList(projectsResult).map(projectFromDocument),toolCart});
  nextItemId=computeNextId();
  try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(app)); }catch(e){}
  setCloudStatus("已连接 Django · 数据已同步","ok");
  return true;
}
async function boot(){
  showLoginOverlay(false,null);
  render(); applyShared();
  try{
    const loaded=await loadRemoteApp();
    if(loaded){ reanchorActive(); render(); }
  }catch(error){
    console.error(error);
    remoteAvailable=false;
    setCloudStatus("后端连接失败 · 正在使用本地缓存","err");
    toast(error&&error.message||"无法连接后端");
  }
}

boot();
</script>
